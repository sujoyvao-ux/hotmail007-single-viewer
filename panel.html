<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📧 Email OTP Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
            padding: 24px 28px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #00d2ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #94a3b8;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 8px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card-title {
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-title small {
            color: #64748b;
            font-size: 0.75rem;
            font-weight: normal;
        }

        /* Balance */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            padding: 12px 16px;
            background: rgba(168, 85, 247, 0.06);
            border-radius: 10px;
            border: 1px solid rgba(168, 85, 247, 0.08);
        }
        .balance-item .label {
            color: #64748b;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .balance-item .value {
            color: #c084fc;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .balance-item .value.green {
            color: #34d399;
        }
        .balance-item .value.gold {
            color: #fbbf24;
        }

        /* Inputs */
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 0.82rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.5;
        }
        textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }
        textarea::placeholder {
            color: #475569;
        }

        .flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .gap-8 {
            gap: 8px;
        }

        /* Buttons */
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #7c3aed;
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
        }
        .btn-block {
            width: 100%;
        }

        /* Status */
        .status {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.1);
        }
        .status.error {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.1);
        }
        .status.loading {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.1);
            display: block;
        }
        .status.info {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.1);
            display: block;
        }

        /* User Bar */
        .user-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(168, 85, 247, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(168, 85, 247, 0.1);
            margin-top: 10px;
        }
        .user-bar.show {
            display: flex;
        }
        .user-bar .email {
            color: #c084fc;
            font-weight: 600;
        }
        .user-bar .count {
            color: #34d399;
        }

        /* Result */
        .result-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 10px;
            border-left: 3px solid #7c3aed;
            transition: all 0.3s ease;
        }
        .result-box:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .result-box .from {
            color: #60a5fa;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .result-box .subject {
            color: #e2e8f0;
            margin: 4px 0;
        }
        .result-box .time {
            color: #64748b;
            font-size: 0.8rem;
        }
        .result-box .otp {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 4px 18px;
            border-radius: 8px;
            display: inline-block;
            letter-spacing: 2px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            margin: 6px 0;
        }
        .result-box .preview {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }
        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
        .empty .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Saved Accounts */
        .saved-accounts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .saved-account {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.7rem;
            color: #94a3b8;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .saved-account:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: #7c3aed;
            color: #fff;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.75rem;
            padding: 16px 0;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .header {
                padding: 16px 18px;
            }
            .card {
                padding: 14px 16px;
            }
            .balance-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .flex {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .user-bar {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📧 Email OTP Reader</h1>
            <p>ক্রেডেনশিয়াল পেস্ট করুন → OTP দেখুন</p>
            <span class="badge">🔒 নিজের অ্যাকাউন্ট</span>
            <span class="badge" style="margin-left:6px;">⚡ Real-time</span>
        </div>

        <!-- Balance -->
        <div class="card">
            <div class="flex" style="justify-content:space-between;">
                <span class="card-title" style="margin-bottom:0;">💰 ব্যালেন্স</span>
                <button class="btn btn-outline btn-sm" onclick="loadBalance()">🔄</button>
            </div>
            <div class="balance-grid" id="balanceInfo">
                <div class="balance-item">
                    <span class="label">ব্যালেন্স</span>
                    <span class="value" id="bal">—</span>
                </div>
                <div class="balance-item">
                    <span class="label">VIP লেভেল</span>
                    <span class="value gold" id="vip">—</span>
                </div>
                <div class="balance-item">
                    <span class="label">ডিসকাউন্ট</span>
                    <span class="value green" id="discount">—</span>
                </div>
            </div>
        </div>

        <!-- Main Input -->
        <div class="card">
            <div class="card-title">
                🔑 ক্রেডেনশিয়াল স্ট্রিং
                <small>(email:password:access_token:refresh_token)</small>
            </div>

            <textarea id="credInput" placeholder="আপনার ক্রেডেনশিয়াল এখানে পেস্ট করুন..."></textarea>

            <div class="flex mt-10">
                <button class="btn btn-primary" onclick="fetchEmail()">🚀 ইমেইল দেখুন</button>
                <button class="btn btn-outline btn-sm" onclick="clearResult()">🗑️</button>
            </div>

            <div id="status" class="status"></div>

            <!-- Saved Accounts -->
            <div class="mt-10">
                <span style="color:#64748b;font-size:0.75rem;">📂 সংরক্ষিত: </span>
                <div class="saved-accounts" id="savedAccounts"></div>
            </div>
        </div>

        <!-- User Info -->
        <div class="user-bar" id="userBar">
            <span class="email" id="userEmail">📧</span>
            <span class="count" id="emailCount">0টি ইমেইল</span>
        </div>

        <!-- Result -->
        <div class="card" id="resultCard" style="display:none;padding:16px;">
            <div id="result"></div>
        </div>

        <div class="footer">
            ⚡ Hotmail007 API | আপনার নিজের ডেটা নিরাপদে রাখুন
        </div>
    </div>

    <script>
        const credInput = document.getElementById('credInput');
        const statusEl = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const resultCard = document.getElementById('resultCard');
        const userBar = document.getElementById('userBar');
        const userEmail = document.getElementById('userEmail');
        const emailCount = document.getElementById('emailCount');

        // ============= Saved Accounts =============
        function loadSaved() {
            const saved = localStorage.getItem('savedCreds');
            if (saved) {
                try {
                    const creds = JSON.parse(saved);
                    renderSaved(creds);
                    return creds;
                } catch (e) {}
            }
            return [];
        }

        function renderSaved(creds) {
            const container = document.getElementById('savedAccounts');
            container.innerHTML = '';
            if (creds.length === 0) {
                container.innerHTML = '<span style="color:#475569;font-size:0.75rem;">কোনো ক্রেডেনশিয়াল সেভ নেই</span>';
                return;
            }
            creds.forEach((cred) => {
                const el = document.createElement('span');
                el.className = 'saved-account';
                const email = cred.split(':')[0] || 'Unknown';
                el.textContent = email;
                el.title = 'ক্লিক করে লোড করুন';
                el.onclick = () => {
                    credInput.value = cred;
                    fetchEmail();
                };
                container.appendChild(el);
            });
        }

        function saveCredential(cred) {
            let creds = loadSaved();
            creds = creds.filter(c => c !== cred);
            creds.unshift(cred);
            if (creds.length > 5) creds = creds.slice(0, 5);
            localStorage.setItem('savedCreds', JSON.stringify(creds));
            renderSaved(creds);
        }

        // ============= Balance =============
        async function loadBalance() {
            try {
                const res = await fetch('/api/balance');
                const data = await res.json();
                if (data.success && data.data) {
                    document.getElementById('bal').textContent = data.data.balance || '0';
                    document.getElementById('vip').textContent = data.data.vipName || `Lv${data.data.vipLevel || 0}`;
                    document.getElementById('discount').textContent = data.data.discountRate ? `${data.data.discountRate}%` : '—';
                }
            } catch (e) {
                console.log('Balance error:', e);
            }
        }

        // ============= Fetch Email =============
        async function fetchEmail() {
            const account = credInput.value.trim();
            if (!account) {
                showStatus('⚠️ ক্রেডেনশিয়াল দিন', 'error');
                return;
            }

            const btn = document.querySelector('.btn-primary');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> লোড...';
            showStatus('⏳ ইমেইল পড়া হচ্ছে...', 'loading');
            resultCard.style.display = 'none';
            userBar.classList.remove('show');

            try {
                const res = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account })
                });
                const data = await res.json();

                if (data.error) {
                    showStatus('❌ ' + data.error, 'error');
                    return;
                }

                if (data.success) {
                    // Save
                    saveCredential(account);

                    // Show user
                    userBar.classList.add('show');
                    userEmail.textContent = '📧 ' + (data.from || 'Unknown');
                    emailCount.textContent = '১টি ইমেইল';

                    const otpHtml = data.otp ?
                        `<div class="otp">🔑 ${data.otp}</div>` :
                        `<div style="color:#64748b;">🔴 OTP পাওয়া যায়নি</div>`;

                    resultDiv.innerHTML = `
                        <div class="result-box">
                            <div class="from">📤 ${data.from}</div>
                            <div class="subject">📌 ${data.subject}</div>
                            ${otpHtml}
                            <div class="time">🕐 ${data.received}</div>
                            <div class="preview">${data.text || 'কোনো কন্টেন্ট নেই'}</div>
                        </div>
                    `;
                    resultCard.style.display = 'block';
                    showStatus('✅ ইমেইল পাওয়া গেছে!', 'success');
                }
            } catch (e) {
                showStatus('❌ Error: ' + e.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '🚀 ইমেইল দেখুন';
        }

        function clearResult() {
            resultCard.style.display = 'none';
            resultDiv.innerHTML = '';
            userBar.classList.remove('show');
            showStatus('🗑️ ক্লিয়ার করা হয়েছে', 'info');
        }

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status show ' + type;
        }

        // ============= Keyboard Shortcut =============
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                fetchEmail();
            }
        });

        // ============= Load =============
        loadSaved();
        loadBalance();

        // Auto fetch if something is there
        setTimeout(() => {
            if (credInput.value.trim()) {
                fetchEmail();
            }
        }, 600);
    </script>
</body>
</html>
